function devMenu(){const e=$('sheet');e.style.display='block';const dc=F.spa?.8:1;
 e.innerHTML='<h3>🏷 生産品目</h3><div class="r">'+PRODS.map((q,i)=>'<button data-p="'+i+'">'+(i==prod?'✔ ':'')+q.n+'　単価×'+q.p+'／材料×'+q.m+(q.r>tech.prec?'<br><small>🔒 精密加工 Lv.'+q.r+' が必要</small>':'')+'</button>').join('')+'</div><h3 style="margin-top:10px">🔬 研究開発'+(F.spa?'（R&Dセンター割引−20%）':'')+'</h3><div class="r">'+TECH.map(t=>{const lv=tech[t.k];return '<button data-t="'+t.k+'">'+t.n+' Lv.'+lv+'/3　'+(lv>=3?'最大':'¥'+fmt(Math.round(t.c*(lv+1)*dc)))+'<br><small>'+t.d+'</small></button>'}).join('')+'</div><div class="r" style="margin-top:10px"><button data-o>⏱ 残業体制：'+(ot?'ON（ライン回転+40%・経費増・事故リスク）':'OFF')+'</button><button data-c>閉じる</button></div>';
 e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;if(d.c!==undefined){e.style.display='none';return}
  if(d.p!==undefined){const q=PRODS[+d.p];if(q.r>tech.prec)return toast('🔒 精密加工の研究が必要です');prod=+d.p;toast('🏷 生産品目：'+q.n)}
  if(d.t!==undefined){const t=TECH.find(x=>x.k==d.t),lv=tech[t.k];if(lv>=3)return;const c=Math.round(t.c*(lv+1)*dc);if(money<c)return toast('資金不足');money-=c;LG.exp+=c;tech[t.k]++;toast('🔬 '+t.n+' Lv.'+tech[t.k]);confetti();beep(880,.15)}
  if(d.o!==undefined){ot=ot?0:1;toast(ot?'⏱ 残業体制 開始':'残業体制 終了')}
  devMenu();hud()}}
$('bD').onclick=devMenu;
function facDaily(){const bl=slots.filter(x=>x.type&&!x.rsv&&!(x.rdy>day));
 if(ot&&built()){const c=built()*1500;money-=c;LG.exp+=c;if(Math.random()<.06){const f=80000;money-=f;LG.evt+=f;rating=Math.max(1,rating-.2);toast('🚑 労働災害（残業の疲労）対応費 ¥'+fmt(f))}}
 if(bl.length&&Math.random()<.06){const x=rnd(bl);x.rdy=day+(S.clean?.6:1.6);toast('🔧 '+x.f+'棟 '+(x.i+1)+'号ライン 設備故障'+(S.clean?'（保守で早期復旧）':'（修理中）'))}
 const r=Math.random();
 if(r<.04){matP=Math.min(1.9,matP*1.4);toast('📈 原材料が高騰しています')}else if(r<.08){matP=Math.max(.6,matP*.7);toast('📉 原材料が値下がり！仕入れのチャンス')}
 else if(r<.13&&built()){if(mat>=30){mat-=30;const b=Math.round(90000*PRODS[prod].p);money+=b;LG.rev+=b;totRev+=b;toast('⚡ 特急オーダーを納品 +¥'+fmt(b))}else toast('⚡ 特急オーダー：在庫不足で見送り')}}
ACH.push([()=>ship>=10000,'累計出荷1万個',50000],[()=>tech.prec+tech.eco+tech.auto+tech.energy>=8,'技術者集団',80000],[()=>prod==3,'半導体メーカー',100000],[()=>(S.work|0)>=10,'作業員10人体制',40000]);
var smk=[];{const mt=new T.MeshBasicMaterial({color:0xdddddd,transparent:true,opacity:.45,depthWrite:false});for(let i=0;i<7;i++){const m=new T.Mesh(new T.SphereGeometry(.6,10,8),mt);m.userData.t=i/7;scene.add(m);smk.push(m)}}
function smokeTick(dt){if(!smk||!smk.length)return;smk.forEach(m=>{m.userData.t=(m.userData.t+dt*.12)%1;const t=m.userData.t;m.position.set(-7.4+t*6,FH+5.3+t*9,-2+t*2);m.scale.setScalar(.5+t*2.2)})}
</script></body></html>
